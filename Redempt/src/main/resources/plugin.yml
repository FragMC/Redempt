name: Redempt
version: 2.0.8-alpha
main: com.stufy.fragmc.redempt.Redempt
api-version: '26.2'
author: Stufy
description: A promo code redemption plugin with EssentialsX integration - Bedrock crossplay via Geyser/Floodgate, 26.2
depend: [Essentials]
softdepend: [Geyser-Spigot, floodgate]

commands:
  promo:
    description: Manage promo codes
    usage: /promo <create|delete|info|list|renew> [args]
    permission: redempt.admin
    aliases: [promocode, promocodes]
  redeem:
    description: Redeem a promo code
    usage: /redeem <code>
    permission: redempt.use
    aliases: [redeemcode, code]

permissions:
  redempt.admin:
    description: Allows access to admin promo commands
    default: op
  redempt.use:
    description: Allows players to redeem promo codes
    default: true